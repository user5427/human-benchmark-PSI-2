# 10.1.0.1 mif dns

stages:
  - build
  - test
  - dockerize
  - deploy

# Build Frontend
build_frontend:
  stage: build
  image: node:16
  script:
    - cd aim-reaction-app  # Change to the frontend directory
    - npm install
    - npm run build
    - ls -la # DEBUG: List all files in the directory
  artifacts:
    paths:
      - aim-reaction-app/build/  # Relative path to the build output

# Build Backend
build_backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:7.0
  script:
    - cd AimReactionAPI  # Change to the backend directory
    - dotnet restore
    - dotnet build --configuration Release
    - dotnet publish -c Release -o ./publish
    - ls -la # DEBUG: List all files in the directory
  artifacts:
    paths:
      - AimReactionAPI/publish/  # Relative path to the publish output

# Test Frontend
test_frontend:
  stage: test
  image: node:16
  script:
    - cd aim-reaction-app  # Change to the frontend directory
    - npm install
    - npm test

# Test Backend
test_backend:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:7.0
  script:
    - cd AimReactionAPI.Tests\AimReactionAPI.Tests.Integration  # Change to the backend directory
    - dotnet test

  script:
    - cd AimReactionAPI.Tests\AimReactionAPI.Tests.Unit  # Change to the backend directory
    - dotnet test

# Dockerize Frontend
dockerize_frontend:
  stage: dockerize
  image: docker:latest
  services:
    - docker:dind
  script:
    - cd aim-reaction-app
    - docker build -t frontend-app .

# Dockerize Backend
dockerize_backend:
  stage: dockerize
  image: docker:latest
  services:
    - docker:dind
  script:
    - cd AimReactionAPI
    - docker build -t backend-app .

# Deploy on the VM
deploy:
  stage: deploy
  script:
    - docker-compose up -d