# 10.1.0.1 mif dns

variables:
  APP_VERSION: "1.0.0"  # Default version, can be overridden

stages:
  - build
  - test
  - dockerize
  - deploy

# Build Frontend
build_frontend:
  stage: build
  image: node:16
  script:
    - cd aim-reaction-app  # Change to the frontend directory
    - npm install
    - npm run build
    - ls -la # DEBUG: List all files in the directory
  artifacts:
    paths:
      - aim-reaction-app/build/  # Relative path to the build output

# Build Backend
build_backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:7.0
  script:
    - cd AimReactionAPI  # Change to the backend directory
    - dotnet restore
    - dotnet build --configuration Release
    - dotnet publish -c Release -o ./publish
    - ls -la # DEBUG: List all files in the directory
  artifacts:
    paths:
      - AimReactionAPI/publish/  # Relative path to the publish output

# Test Frontend
test_frontend:
  stage: test
  image: node:16
  script:
    - cd aim-reaction-app  # Change to the frontend directory
    - npm install
    - npm test

# Test Backend
test_backend_unit:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:7.0
  script:
    - cd "AimReactionAPI.Tests/AimReactionAPI.Tests.Unit"  # Change to the backend directory
    - dotnet test

# Test Backend
test_backend_integration:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:7.0
  script:
    - cd "AimReactionAPI.Tests/AimReactionAPI.Tests.Integration"  # Change to the backend directory
    - dotnet test

# Dockerize Frontend
dockerize_frontend:
  stage: dockerize
  image: docker:latest
  services:
    - docker:dind
  script:
    - cd aim-reaction-app
    - docker build -t frontend-app:${APP_VERSION} .
    - docker tag frontend-app:${APP_VERSION} frontend-app:latest

# Dockerize Backend
dockerize_backend:
  stage: dockerize
  image: docker:latest
  services:
    - docker:dind
  script:
    - cd AimReactionAPI
    - docker build -t backend-app:${APP_VERSION} .
    - docker tag backend-app:${APP_VERSION} backend-app:latest
    

bump_version:
  stage: build
  tags:
    - shell
  script:
    - git config --global user.email "gitlab-ci@example.com"
    - git config --global user.name "GitLab CI"
    - git fetch --tags
    
    # Calculate new version
    - |
      LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
      VERSION=${LATEST_TAG#v}
      IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

      [[ "$CI_COMMIT_MESSAGE" == *"#major"* ]] && { MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0; }
      [[ "$CI_COMMIT_MESSAGE" == *"#minor"* ]] && { MINOR=$((MINOR+1)); PATCH=0; }
      [[ "$CI_COMMIT_MESSAGE" == *"#patch"* ]] && PATCH=$((PATCH+1))

      NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
      echo "New version: $NEW_VERSION"
      echo "APP_VERSION=${MAJOR}.${MINOR}.${PATCH}" > build.env

    # Push using CI_JOB_TOKEN (proper formatting)
    - |
      REPO_URL="${CI_REPOSITORY_URL/https:\/\//https://gitlab-ci-token:${CI_JOB_TOKEN}@}"
      git tag -a "$NEW_VERSION" -m "Version $NEW_VERSION"
      git push "$REPO_URL" "$NEW_VERSION" || echo "Tag push failed - check protected tags settings"
  
  artifacts:
    paths:
      - build.env
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /#(major|minor|patch)/
      when: manual



# Deploy on the VM
deploy:
  stage: deploy
  script:
    - docker-compose up -d
  variables:
    FRONTEND_IMAGE: "frontend-app:${APP_VERSION}"
    BACKEND_IMAGE: "backend-app:${APP_VERSION}"