stages:
  - build
  - dockerize
  - deploy

variables:
  FRONTEND_IMAGE_TAG: "your-docker-registry/your-frontend-app:latest"
  BACKEND_IMAGE_TAG: "your-docker-registry/your-backend-app:latest"
  DOCKER_REGISTRY: "your-docker-registry"
  DOCKER_USER: "your-docker-username"
  DOCKER_PASSWORD: "your-docker-password"

# Build Frontend
build_frontend:
  stage: build
  image: node:16
  working_directory: ./aim-reaction-app
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - ./ClientApplication/react-app/build/

# Build Backend
build_backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:7.0
  working_directory: ./AimReactionAPI
  script:
    - dotnet restore
    - dotnet build --configuration Release
    - dotnet publish -c Release -o ./publish
  artifacts:
    paths:
      - ./publish/

# Dockerize Frontend
dockerize_frontend:
  stage: dockerize
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin "$DOCKER_REGISTRY"
    - docker build -t $FRONTEND_IMAGE_TAG -f ./aim-reaction-app/Dockerfile .
    - docker push $FRONTEND_IMAGE_TAG

# Dockerize Backend
dockerize_backend:
  stage: dockerize
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin "$DOCKER_REGISTRY"
    - docker build -t $BACKEND_IMAGE_TAG -f ./AimReactionAPI/Dockerfile .
    - docker push $BACKEND_IMAGE_TAG

# Deploy (example: Kubernetes)
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying frontend and backend to Kubernetes..."
    - kubectl apply -f kubernetes/frontend-deployment.yaml
    - kubectl apply -f kubernetes/frontend-service.yaml
    - kubectl apply -f kubernetes/backend-deployment.yaml
    - kubectl apply -f kubernetes/backend-service.yaml
  only:
    - main